# Project
version=11.0.1
group=com.grim3212.assorted.storage
license=LGPL-3.0-only
issue_tracker=https://github.com/grim3212/AssortedStorage/issues
# Build
# The AssortedBuild release this mod builds with. Minecraft, NeoForge, Fabric and tooling versions
# all come from it; bump it to move to a newer set.
assortedbuild_version=26.2.0
# Mod Options
mod_name=Assorted Storage
mod_author=Grim3212
mod_id=assortedstorage
mod_description=Assorted blocks and items useful for storage.
# The AssortedLib this mod needs: its minimum, declared as such on both loaders.
assortedlib_version=4.0.1
# Dependencies
curios_version=16.0.0+26.2
# Knobs. Absent means off.
jei_enabled=false
client_gametests_enabled=true
neoforge_ats_enabled=false
common_runs_enabled=false
# Publishing
# Where a release goes. The release job checks both ids before it uploads anything: a
# blank one publishes to nowhere and reports success.
modrinth_id=RY5hZOKH
curseforge_id=408724
# Only the Discord announcement reads the slug, but it is also the one human-readable name of
# the CurseForge project anywhere in the repo.
curseforge_slug=assorted-storage
# The default release channel: release, beta or alpha. -PreleaseType overrides it.
release_type=release
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false

plugins {
    id 'com.grim3212.assorted.neoforge'
}

dependencies {
    // Curios' optional integration: 16.0.0+26.2 is published and resolves from ModMaven, which the
    // convention already declares. The api classifier is a classes+sources jar; transitive = false
    // keeps Curios' own net.neoforged dependencies out of the graph, which the content-filtered
    // repos would refuse anyway. compileOnly only - the integration is guarded by isModLoaded, so
    // nothing needs Curios present at dev runtime.
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api") { transitive = false }
}
